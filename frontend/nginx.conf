limit_req_zone $server_name zone=demo_chat_rate:10m rate=1r/s;
limit_conn_zone $server_name zone=demo_chat_conn:10m;

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    limit_conn demo_chat_conn 2;
    limit_conn_status 429;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=demo_chat_rate burst=3 nodelay;
        proxy_pass http://demo-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ /\. {
        deny all;
    }

    location = /nginx.conf { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
